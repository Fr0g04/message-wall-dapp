services:
  - type: web
    name: message-wall-dapp
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WALL_TITLE
        value: Message Wall
      # Render prompts for these two while creating the Blueprint.
      - key: CONTRACT_ADDRESS
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
